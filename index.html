<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Happy Birthday Diya 💜</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Georgia, 'Times New Roman', serif;
      background: linear-gradient(135deg, #f7efff, #ead7ff, #d8b8ff);
      color: #4b286d;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Floating hearts */
    .heart {
      position: fixed;
      bottom: -30px;
      color: #b57edc;
      font-size: 20px;
      animation: float 8s linear infinite;
      opacity: 0.7;
      z-index: 0;
    }

    @keyframes float {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
      }
      20% {
        opacity: 0.8;
      }
      100% {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
      }
    }

    .container {
      position: relative;
      z-index: 1;
      width: 90%;
      max-width: 850px;
      margin: auto;
      padding: 60px 0;
      text-align: center;
    }

    .card {
      background: rgba(255,255,255,0.75);
      backdrop-filter: blur(10px);
      border-radius: 30px;
      padding: 45px 25px;
      box-shadow: 0 15px 40px rgba(100, 55, 130, 0.2);
      margin-bottom: 30px;
      border: 1px solid rgba(255,255,255,0.8);
    }

    .crown {
      font-size: 55px;
      animation: bounce 2s infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }

    h1 {
      font-size: clamp(45px, 10vw, 80px);
      margin: 10px 0;
      color: #7b3fb2;
      text-shadow: 2px 2px 0 #ead7ff;
    }

    .subtitle {
      font-size: 21px;
      color: #80559d;
      margin-bottom: 20px;
    }

    .date {
      display: inline-block;
      background: #9b62c4;
      color: white;
      padding: 10px 22px;
      border-radius: 30px;
      font-size: 16px;
      margin: 10px;
    }

    .divider {
      width: 80px;
      height: 3px;
      background: #a66dcc;
      margin: 25px auto;
      border-radius: 10px;
    }

    h2 {
      font-size: 32px;
      color: #713a9d;
      margin-bottom: 20px;
    }

    .letter {
      text-align: left;
      line-height: 1.9;
      font-size: 18px;
      color: #543b63;
    }

    .letter p {
      margin-bottom: 18px;
    }

    .signature {
      text-align: right;
      font-style: italic;
      font-size: 20px;
      color: #7b3fb2;
    }

    .reasons {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
      margin-top: 25px;
    }

    .reason {
      background: #f4e7ff;
      padding: 22px 12px;
      border-radius: 20px;
      font-size: 16px;
      transition: 0.3s;
    }

    .reason:hover {
      transform: translateY(-7px);
      background: #ead5ff;
    }

    .button {
      border: none;
      background: linear-gradient(135deg, #8d4fc1, #b678dc);
      color: white;
      padding: 16px 30px;
      border-radius: 35px;
      font-size: 17px;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(115, 54, 150, 0.25);
      transition: 0.3s;
    }

    .button:hover {
      transform: scale(1.05);
    }

    #surprise {
      display: none;
      margin-top: 25px;
      font-size: 21px;
      line-height: 1.7;
      color: #693a86;
    }

    .footer {
      font-size: 15px;
      color: #765584;
      margin-top: 25px;
    }

    .sparkle {
      font-size: 25px;
      margin: 0 5px;
    }
  </style>
</head>

<body>

  <div class="heart" style="left:52%; animation-delay:1s;">🦋</div>
